// install installGithubActions

tasks.register('installGithubActions', Copy) {
    group = 'github'
    description = 'Install the github actions'
    from new File(rootProject.rootDir, 'gradleConfig/scripts/github/workflows/ci.yml')
    into new File(rootProject.rootDir, '.github/workflows')
    filePermissions { unix(0774) }

    // Força o Gradle a executar a task sempre (ignorando o cache up-to-date)
    outputs.upToDateWhen { false }

    filter { line ->
        if (line.startsWith("name:")) {
            "# ========================================================\n" +
                    "# ATENCAO: Este arquivo foi gerado automaticamente pelo Gradle.\n" +
                    "# NAO EDITE ESTE ARQUIVO DIRETAMENTE.\n" +
                    "# Edite o molde em: gradleConfig/scripts/github/workflows/\n" +
                    "# ========================================================\n\n" + line
        } else {
            line
        }
    }

}

tasks.getByPath(':app:preBuild')
        .dependsOn(installGithubActions)