tasks.register('installKtlintConfig', Copy) {
    group = 'configuration'
    description = 'Install the ktlint configuration'

    from new File(rootProject.rootDir, 'config/ktlint/.editorconfig')
    into rootProject.rootDir
    filePermissions { unix(0774) }

    doNotTrackState(
            'Copies the ktlint configuration to the project root'
    )
}

tasks.getByPath(':app:preBuild')
        .dependsOn(installKtlintConfig)
