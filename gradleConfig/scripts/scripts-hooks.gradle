// install preCommitGitHooks

tasks.register('installPreCommitGitHooks', Copy) {
    group = 'git'
    description = 'Install the pre-commit git hook'
    from new File(rootProject.rootDir, 'gradleConfig/scripts/pre-commit')
    into new File(rootProject.rootDir, '.git/hooks')
    filePermissions { unix(0774) }
}

tasks.getByPath(':app:preBuild')
        .dependsOn(installPreCommitGitHooks)