apply from: rootProject.file("appCore/gradleConfig/core-submodule.gradle")

apply plugin: appCoreLibs.plugins.ksp.get().pluginId

android {
    namespace 'br.com.leonardo.localData'

    defaultConfig {
        testInstrumentationRunner 'br.com.leonardo.localData.DatabaseInstrumentationTestRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Koin
    implementation appCoreLibs.koin.androidx.compose

    // Koin tests
    testImplementation appCoreLibs.koin.test
    testImplementation appCoreLibs.koin.test.junit4

    // Coroutines tests
    testImplementation appCoreLibs.kotlinx.coroutines.test

    // Room database
    implementation appCoreLibs.androidx.room.runtime
    ksp appCoreLibs.androidx.room.compiler
    implementation appCoreLibs.androidx.room.ktx
}
