// install installGithubActions

tasks.register('installGithubActions', Copy) {
    group = 'github'
    description = 'Install the github actions'
    from new File(rootProject.rootDir, 'appCore/gradleConfig/scripts/github/workflows/ci.yml')
    into new File(rootProject.rootDir, '.github/workflows')
    filePermissions { unix(0774) }

    // Força o Gradle a executar a task sempre (ignorando o cache up-to-date)
    outputs.upToDateWhen { false }

    filter { line ->
        if (line.startsWith("name:")) {
            "# ========================================================\n" +
                    "# ATENCAO: Este arquivo foi gerado automaticamente pelo Gradle.\n" +
                    "# NAO EDITE ESTE ARQUIVO DIRETAMENTE.\n" +
                    "# Edite o molde em: appCore/gradleConfig/scripts/github/workflows/\n" +
                    "# ========================================================\n\n" + line
        } else {
            line
        }
    }
}

def targetModule = project.hasProperty("targetAppModule") ? project.targetAppModule : null

if (targetModule != null) {
    tasks.getByPath("${targetModule}:preBuild").dependsOn(installGithubActions)
} else {
    subprojects {
        plugins.withId('com.android.application') {
            tasks.named('preBuild') {
                dependsOn(installGithubActions)
            }
        }
    }
}
